name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate schemas, evidence and mappings
        run: python scripts/validate.py
      - name: Verify deterministic regeneration
        run: python scripts/build_cases.py --check
      - name: Test controls and rejection paths
        run: python -m unittest discover -s tests -v

